# Exemplo de Secret. NÃO aplique com valores reais no repositório.
# Crie no cluster com:
#   kubectl create secret generic elessandrodev-backend-secrets \
#     --from-literal=OPENROUTER_API_KEY=... \
#     --from-literal=CLOUDFLARE_ACCOUNT_ID=... \
#     --from-literal=CLOUDFLARE_API_TOKEN=...
apiVersion: v1
kind: Secret
metadata:
  name: elessandrodev-backend-secrets
  labels:
    app.kubernetes.io/name: elessandrodev
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  OPENROUTER_API_KEY: replace-me
  CLOUDFLARE_ACCOUNT_ID: replace-me
  CLOUDFLARE_API_TOKEN: replace-me
  EMBEDDINGS_API_KEY: replace-me
