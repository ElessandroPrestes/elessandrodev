# Substitua o host e o secret TLS pelos valores reais do cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elessandrodev
  labels:
    app.kubernetes.io/name: elessandrodev
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 4k
    nginx.ingress.kubernetes.io/proxy-read-timeout: "45"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - elessandrodev.example.com
      secretName: elessandrodev-tls
  rules:
    - host: elessandrodev.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
