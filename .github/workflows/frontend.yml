name: CI Frontend

on:
  push:
    branches:
      - main
      - develop
      - "feature/migrate-rag-node-langchain-kubernetes"
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Test e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests
        env:
          VITE_CHAT_API_URL: http://127.0.0.1:3201/api/chat
          VITE_LLM_MAX_RETRIES: "0"
        run: npm test

      - name: Build
        env:
          VITE_CHAT_API_URL: /api/chat
        run: npm run build
